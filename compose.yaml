name: trellis-hackathon

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cs1301
      POSTGRES_USER: cs1301
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs1301"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "start-web.sh"]
    env_file: .env
    ports: ["127.0.0.1:${TRELLIS_BACKEND_PORT:-8000}:8000"]
    environment:
      ALLOW_LOCAL_LOGIN: "1"
      TRELLIS_FRONTEND_PORT: ${TRELLIS_FRONTEND_PORT:-5173}
    volumes:
      - ./backend:/app
      - ./course-data:/course-data:ro
      - private-media:/app/private-media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "config.celery", "worker", "-l", "INFO"]
    env_file: .env
    volumes:
      - ./backend:/app
      - private-media:/app/private-media
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${TRELLIS_FRONTEND_PORT:-5173}:5173"]
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    depends_on:
      backend: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  private-media:
  frontend-modules:
